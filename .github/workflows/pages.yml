name: Testar e publicar FrameCraft no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes, TypeScript e build
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes
        run: npm test
      - name: Compilar frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: 'https://dtvbphnoqkbxlwdiivvv.supabase.co/functions/v1/framecraft-api'
        run: npm run build
      - name: Validar arquivos do Vite para GitHub Pages
        run: node scripts/verify-pages-build.mjs
      - name: Desabilitar Jekyll
        if: github.event_name != 'pull_request'
        run: touch dist/.nojekyll
      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publicar site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Obter código para verificação pública
        uses: actions/checkout@v4
      - name: Configurar a origem correta do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "GitHub Pages configurado para publicar pelo GitHub Actions."
          else
            echo "::warning::Não foi possível ajustar a origem pelo token do workflow. Configure Settings > Pages > Build and deployment > Source = GitHub Actions."
          fi
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar página, JavaScript e favicon publicados
        run: node scripts/verify-pages-live.mjs
